# The pad map, for OpenGothic on the PS4.
#
# Copy to  /data/tempest-pad.cfg  on the console.  It is re-read whenever its timestamp changes, so
# an FTP overwrite takes effect within a second WITHOUT leaving the game or rebuilding anything.
# The title logs the whole resolved table every time it loads one, so what the console parsed is
# always visible - and a file with a bad line is refused WHOLE, with the first bad line named.
#
# ------------------------------------------------------------------ what this file is doing
#
# The pad does not talk to a pad interface. It forges the keyboard and mouse events OpenGothic
# already understands, and that works for every context - world, menu, dialog, inventory - because
# Gothic's own routing resolves the context:
#
#   * the LEFT and RIGHT MOUSE BUTTONS are already world actions in a stock Gothic.ini
#     (keyAction contains 0x0c02, keyParade contains 0x0d02) AND are hard-coded in every widget as
#     confirm/back.  MenuRoot::mouseDownEvent activates the SELECTED item and ignores where the
#     cursor is, so a forged click needs no pointer at all.
#   * the movement keys navigate every menu: MenuRoot accepts W/A/S/D beside the arrows, and the
#     inventory routes them through the ini bindings.
#   * the NUMBER ROW is spells 3..10 plus melee(1) and bow(2), hard-coded in KeyCodec and reachable
#     no other way - and the same keys assign a spell slot while the inventory is open.
#
# So the right-hand side of every line below is a key that a stock Gothic.ini binds, or a mouse
# button, and nothing here needs Gothic.ini to be edited.
#
# ------------------------------------------------------------------ syntax
#
#   <input> = <target> [repeat]
#   [MOD+]<input> = <target> [repeat]        MOD is one of L1 R1 L2 R2, and they combine
#
#   inputs   Cross Circle Triangle Square  L1 R1 L2 R2  L3 R3
#            DUp DDown DLeft DRight  Options Touch
#            LUp LDown LLeft LRight            <- the LEFT stick, as four digital directions
#   targets  a key:  A..Z  0..9  Up Down Left Right  Return Escape Space Tab Back Delete
#                    LCtrl LShift LAlt  RCtrl RShift RAlt  F1..F12
#            a mouse button:  LMB RMB MMB
#            or:  wheelUp  wheelDown  none
#
# `repeat` is the difference between a direction and a decision: holding a direction in a menu is a
# request to keep moving, holding "confirm" is not a request to confirm again.
#
# A modifier is matched EXACTLY FIRST, so `Cross` and `L1+Cross` are different binds and holding L1
# fires the spell, not the attack.  A button that is also a modifier (L2 below is both jump and the
# zoom layer) still fires its own bind, because an input is excluded from its own modifier mask.
#
# ⚠ AND AN UNBOUND COMBINATION FALLS BACK TO THE BARE BIND.  A modifier masks what it REBINDS, not
# everything.  Until 2026-08-21 the mask was final, so while L2 (jump) or R2 (attack) was held every
# bare bind became an unbound `L2+X` and went dead - no attack while jumping, no inventory, status,
# log or map while attacking.  Both are HELD in normal play, so this was most of the pad.
#
# The RIGHT stick is not in this table: it is always the camera, because forged mouse MOVEMENT is
# the only thing that reaches it - no key does.  Its gain and inversion are the two settings below.

# ------------------------------------------------------------------ stick shaping
deadzone    = 0.35

# ⚠ WALK IS A TOGGLE IN THIS GAME, NOT A SPEED. PlayerControl::onKeyPressed does
# `if(a==Action::Walk) toggleWalkMode()`, and toggleWalkMode XORs a bit - so only the PRESS does
# anything and there is no such thing as "holding walk".
#
# Two versions of this file tried to drive that toggle from how far the stick is pushed, and both were
# a coin toss rather than a zone: the flip happened on the way into the band and nothing undid it on
# the way out, so a full deflection left you walking - and at a 36 ms poll a quick push skips the band
# entirely and flips nothing.
#
# So: 0 = OFF, which is the default, and Walk lives on R1+DDown as a proper toggle further down.
# Above 0 it works - each band edge now sends a tap, so the flips cancel for a push that passes
# through - but it is mirroring state that a script or a loaded save can change without us, and when
# that desyncs it stays wrong until the next crossing. Enable it if you want it, knowing that.
walkZone    = 0

# ONE DIRECTION AT A TIME. Gothic has no diagonal movement, so the two stick axes compete and only the
# winner is emitted; this is how much bigger the sideways deflection has to be before it wins. Raise it
# if a slight lean still strafes, lower it towards 1.0 if strafing feels hard to reach.
strafeBias  = 1.6

# Camera. The chain is: pixels * (mouseSensitivity/mouseSysSpeed) / 1920 * 270 = degrees per frame,
# which with Gothic.ini's 0.5 is pixels * 0.0703 - so 45 is roughly 190 degrees a second at full
# deflection. Scaled by elapsed time, so the turn rate no longer follows the frame rate.
lookScale   = 45.0
# The exponent on the stick's deflection: 1.0 is linear, higher gives finer control near the centre for
# the same top speed. Aiming wants the small end, turning around wants the large one.
lookCurve   = 1.6
lookInvertY = 0

# ------------------------------------------------------------------ movement and camera
# ⚠ IF FORWARD AND BACK COME OUT SWAPPED, swap these two lines. Which half of the stick's y axis is
# "up" is the one thing here taken from convention rather than from a measurement, and this file is
# exactly the right place to correct it - no rebuild.
LUp         = W
LDown       = S
LLeft       = A
LRight      = D

# ------------------------------------------------------------------ the two that carry every context
Cross       = LMB          # keyAction 0c02: use / talk / attack   | menu: confirm | inv: use
Circle      = RMB          # keyParade 0d02: BLOCK                 | menu: back    | inv: close

# ------------------------------------------------------------------ the world
Triangle    = Space        # keyWeapon 3900 - draws the last weapon
Square      = H            # keyHeal   2300
L2          = LAlt         # keySMove  3800 - jump, and "take the whole stack" in a loot window
R2          = LCtrl        # keyAction 1d00 - attack, beside Cross
L3          = X            # keySneak  2d00
R3          = F            # keyLookFP 2100
Touch       = P            # keyPotion 1900
Options     = Escape

# ------------------------------------------------------------------ the four screens
DUp         = Tab          # keyInventory  0f00
DDown       = B            # keyShowStatus 3000
DLeft       = N            # keyShowLog    3100
DRight      = M            # keyShowMap    3200

# ------------------------------------------------------------------ L1: the eight spell slots
# Also what assigns a slot while the inventory is open, which is free symmetry.
L1+DUp      = 3
L1+DRight   = 4
L1+DDown    = 5
L1+DLeft    = 6
L1+Triangle = 7
L1+Circle   = 8
L1+Cross    = 9
L1+Square   = 0

# ------------------------------------------------------------------ R1: choosing a weapon
# Triangle alone only toggles the LAST one; these pick.
R1+Triangle = 1            # melee
R1+Square   = 2            # bow
R1+DUp      = R            # keyLook 1300 - look back
R1+DDown    = LShift       # keySlow 2a00 - WALK/RUN, and it is a toggle: press once, not held

# ------------------------------------------------------------------ L2: camera distance
# The wheel is also menu navigation and inventory scrolling, for free.
L2+DUp      = wheelUp    repeat
L2+DDown    = wheelDown  repeat
